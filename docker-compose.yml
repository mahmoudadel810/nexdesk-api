name: nexdesk

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexdesk}
      POSTGRES_USER: ${POSTGRES_USER:-nexdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  api:
    build:
      context: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-nexdesk};Username=${POSTGRES_USER:-nexdesk};Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Inbound__Secret: ${INBOUND_SECRET:?Set INBOUND_SECRET in .env}
      PlatformAdmin__Email: ${PLATFORM_ADMIN_EMAIL:-}
      PlatformAdmin__Password: ${PLATFORM_ADMIN_PASSWORD:-}
      # The end-to-end suite signs in many times from one address; raise this only for that.
      RateLimiting__Enabled: ${RATE_LIMITING_ENABLED:-true}
      RateLimiting__AuthPerMinute: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      Email__Host: mailpit
      Email__Port: 1025
      App__WebBaseUrl: ${WEB_BASE_URL:-http://localhost:4200}
      Storage__RootPath: /var/lib/nexdesk/storage
      # Lets webhooks reach a receiver on this machine or network, for trying them out locally.
      Webhooks__AllowPrivateNetworks: ${WEBHOOKS_ALLOW_PRIVATE_NETWORKS:-false}
    volumes:
      - attachment-data:/var/lib/nexdesk/storage
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres-data:
  attachment-data:

<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{subject}}</title>
  </head>
  <body style="margin:0;padding:0;background:#f3f5f9;font-family:'Segoe UI',Roboto,Tahoma,Arial,sans-serif;color:#1b1f27;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f5f9;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="background:#0b57d0;color:#ffffff;padding:20px 32px;font-size:20px;font-weight:600;">NexDesk</td>
            </tr>
            <tr>
              <td style="padding:32px;font-size:15px;line-height:1.6;">
                <h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;">{{heading}}</h1>
                {{body}}
                {{button}}
                <p style="margin:24px 0 0;color:#5c6370;font-size:13px;">{{footer}}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
